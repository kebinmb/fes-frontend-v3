<div
  class="sidebar-overlay"
  [class.show]="sidebarService.sidebarOpen()"
  (click)="closeSidebar()"
></div>

<aside
  class="admin-sidebar"
  [class.mobile-open]="sidebarService.sidebarOpen()"
  aria-label="Administrator navigation"
>

  <!-- HEADER -->
  <div class="sidebar-header">

    <div class="sidebar-logo">

      <div class="logo-mark">
        CH
      </div>

      <div class="logo-content">

        <h2>
          CHMSU FES
        </h2>

        <span>
          Administrator Panel
        </span>

      </div>

    </div>

  </div>

  <!-- BODY -->
  <div class="sidebar-body">

    <nav class="sidebar-nav" aria-label="Primary navigation">

      <div class="nav-section">
        <span class="nav-section-label">Overview</span>

        <a
          class="nav-item"
          routerLink="/admin-dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeSidebar()"
        >
          <i class="bi bi-grid-1x2-fill"></i>

          <span>
            Dashboard
          </span>
        </a>
      </div>

      <div class="nav-section">
        <span class="nav-section-label">Management</span>

        <a
          class="nav-item"
          routerLink="/admin-dashboard/faculty-list"
          routerLinkActive="active"
          (click)="closeSidebar()"
        >
          <i class="bi bi-person-workspace"></i>

          <span>
            Faculty
          </span>
        </a>

        <a
          class="nav-item"
          routerLink="/admin-dashboard/user-accounts"
          routerLinkActive="active"
          (click)="closeSidebar()"
        >
          <i class="bi bi-people-fill"></i>

          <span>
            User Accounts
          </span>
        </a>
      </div>

      <div class="nav-section">
        <span class="nav-section-label">Evaluations</span>

        <a
          class="nav-item"
          routerLink="/admin-dashboard/evaluation-score-list"
          routerLinkActive="active"
          (click)="closeSidebar()"
        >
          <i class="bi bi-clipboard-data"></i>

          <span>
            Faculty Scores
          </span>
        </a>

        <a
          class="nav-item"
          routerLink="/admin-dashboard/student-evaluations"
          routerLinkActive="active"
          (click)="closeSidebar()"
        >
          <i class="bi bi-journal-check"></i>

          <span>
            Student Scores
          </span>
        </a>

        <a
          class="nav-item"
          routerLink="/admin-dashboard/student-evaluation-list"
          routerLinkActive="active"
          (click)="closeSidebar()"
        >
          <i class="bi bi-table"></i>

          <span>
            Student List
          </span>
        </a>
      </div>

      <div class="nav-section nav-section-bottom">
        <span class="nav-section-label">System</span>

        <a
          class="nav-item"
          routerLink="/admin-dashboard/settings"
          routerLinkActive="active"
          (click)="closeSidebar()"
        >
          <i class="bi bi-gear-fill"></i>

          <span>
            Settings
          </span>
        </a>
      </div>

    </nav>

  </div>

</aside>
