<div
  class="sidebar-overlay"
  [class.show]="sidebarService.sidebarOpen()"
  (click)="closeSidebar()"
></div>

<aside class="admin-sidebar" [class.mobile-open]="sidebarService.sidebarOpen()">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <div class="logo-mark">CH</div>

      <div class="logo-content">
        <h2>CHMSU FES</h2>

        <span>Administrator Panel</span>
      </div>
    </div>
  </div>

  <div class="sidebar-body">
    <nav class="sidebar-nav">
      <a
        class="nav-item"
        routerLink="/admin-dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidebar()"
      >
        <i class="bi bi-grid-1x2"></i>

        <span>Dashboard</span>
      </a>

      <a
        class="nav-item"
        routerLink="/admin-dashboard/faculty-list"
        routerLinkActive="active"
        (click)="closeSidebar()"
      >
        <i class="bi bi-people"></i>

        <span>Faculty List</span>
      </a>

      <a
        class="nav-item"
        routerLink="/admin-dashboard/user-accounts"
        routerLinkActive="active"
        (click)="closeSidebar()"
      >
        <i class="bi bi-person-badge"></i>

        <span>User Accounts</span>
      </a>

      <a
        class="nav-item"
        routerLink="/admin-dashboard/evaluation-score-list"
        routerLinkActive="active"
        (click)="closeSidebar()"
      >
        <i class="bi bi-bar-chart"></i>

        <span>Evaluation Scores</span>
      </a>

      <a
        class="nav-item"
        routerLink="/admin-dashboard/student-evaluations"
        routerLinkActive="active"
        (click)="closeSidebar()"
      >
        <i class="bi bi-bar-chart"></i>

        <span>Student Evaluation Scores</span>
      </a>

      <a
        class="nav-item"
        routerLink="/admin-dashboard/student-evaluation-list"
        routerLinkActive="active"
        (click)="closeSidebar()"
      >
        <i class="bi bi-bar-chart"></i>

        <span>Student Evaluation List</span>
      </a>

      <a
        class="nav-item"
        routerLink="/admin-dashboard/settings"
        routerLinkActive="active"
        (click)="closeSidebar()"
      >
        <i class="bi bi-gear"></i>

        <span>Settings</span>
      </a>
    </nav>
  </div>

  <div class="sidebar-footer">
    <div class="admin-avatar">A</div>

    <div class="footer-content">
      <h3>Administrator</h3>

      <span>System Manager</span>
    </div>
  </div>
</aside>
