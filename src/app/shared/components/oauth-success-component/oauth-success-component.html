<main class="oauth-page" aria-labelledby="oauthTitle">
  <section class="oauth-card">
    <div class="oauth-logo-wrap">
      <img
        src="chmsu-logo.png"
        alt="Carlos Hilado Memorial State University logo"
        class="oauth-logo"
      />
    </div>

    <div class="oauth-spinner" role="status" aria-label="Completing sign in">
      <span class="ui-spinner" aria-hidden="true"></span>
    </div>

    <p class="oauth-eyebrow">Secure Authentication</p>

    <h1 id="oauthTitle">Completing Your Sign In</h1>

    <p class="oauth-message">
      Please wait while we verify your account and prepare your dashboard.
    </p>
  </section>
</main>
